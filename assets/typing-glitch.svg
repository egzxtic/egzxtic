<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 170" role="img" aria-label="Typing Glitch">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="0;1.8;0;0;1.6;0" dur="0.8s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap');
      text { font-family: 'Orbitron', 'Arial', sans-serif; font-size: 58px; letter-spacing: 8px; font-weight: 700; }
    </style>
  </defs>

  <rect width="980" height="170" fill="#05070d"/>

  <g transform="translate(40,110)">
    <text x="0" y="0" fill="#d9f4ff" filter="url(#noise)">
      <tspan>CYBER NEXUS INTERFACE</tspan>
      <animate attributeName="opacity" values="0;1;1;0.65;1;0;1" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ffffff;#ffffff;#8fefff;#ffffff;#b7e8ff;#ffffff" dur="2.6s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="0" fill="#ff2f9d" opacity="0.45">
      <tspan x="0" y="0">CYB3R N3XUS INT3RFAC3</tspan>
      <animate attributeName="opacity" values="0;0.85;0;0.45;0;0.7;0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="0;-4;3;-3;0" dur="0.2s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="0" fill="#6f8bff" opacity="0.35">
      <tspan x="1" y="0">CYBER  NEXUS INTERFACE</tspan>
      <animate attributeName="opacity" values="0;0.5;0;0.55;0;0.45;0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="x" values="0;2;-2;1;0" dur="0.15s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="50" fill="#d9f4ff" font-size="34">
      <tspan>WELCOME TO DARK TECH AESTHETIC</tspan>
      <animate attributeName="opacity" values="1;1;0.7;1;1" dur="2.7s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="0" y="0" width="980" height="170" fill="url(#scanline)" opacity="0"/>
  <defs>
    <linearGradient id="scanline">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
