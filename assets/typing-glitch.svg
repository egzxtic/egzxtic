<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 180" role="img" aria-label="EGZXTIC glitch header">
  <defs>
    <filter id="flicker" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.5" numOctaves="2" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0">
        <animate attributeName="scale" values="0;0;1.4;0;0.8;0" dur="0.8s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>

  <rect width="980" height="180" fill="#06080f"/>

  <g transform="translate(60,78)" font-family="Verdana, Arial, sans-serif">
    <text id="title" x="0" y="0" fill="#ffffff" font-size="72" font-weight="700" letter-spacing="9">
      <tspan fill="#ffffff">EGZXTIC</tspan>
      <animate attributeName="opacity" values="1;1;0.85;1;1" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="0;1;-2;1;0" dur="0.18s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="62" fill="#a9f1ff" font-size="34" letter-spacing="4">
      <tspan>egzo.dev</tspan>
      <animate attributeName="opacity" values="0;1;1;0.9;1;1;0.95;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="0;-1;2;-1;0" dur="0.22s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="0" fill="#ff5cd8" opacity="0.35" font-size="72" font-weight="700" letter-spacing="9" filter="url(#flicker)">
      <tspan>EGZXTIC</tspan>
      <animate attributeName="opacity" values="0;0.7;0;0.5;0;0" dur="1.1s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="60" y1="95" x2="900" y2="95" stroke="#2a3857" stroke-width="2" opacity="0.65"/>
  <line x1="60" y1="97" x2="900" y2="97" stroke="#7df5ff" stroke-width="1" opacity="0.35">
    <animate attributeName="opacity" values="0.1;0.55;0.2;0.45;0.1" dur="1.2s" repeatCount="indefinite"/>
  </line>
</svg>
