<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">EGZXTIC motion text</title>
  <desc id="desc">White text animation without background</desc>

  <defs>
    <clipPath id="scan">
      <rect id="scan-rect" x="80" y="55" width="0" height="120" rx="3">
        <animate attributeName="x" values="80;80;80;80" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="width" values="0;840;840;0" dur="3.6s" repeatCount="indefinite" keyTimes="0;0.12;0.82;1"/>
      </rect>
    </clipPath>

    <filter id="soft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#scan)">
    <text x="500" y="145" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="24">
      <tspan>E G Z X T I C</tspan>
      <animate attributeName="opacity" values="1;1;0.85;1" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="transform" attributeType="XML" type="translate" values="0 0; -4 0; 4 0; 0 0; 0 0" dur="0.7s" repeatCount="indefinite"/>
    </text>
  </g>

  <g filter="url(#soft)" opacity="0.35" clip-path="url(#scan)">
    <text x="500" y="145" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="24">
      <tspan>E G Z X T I C</tspan>
      <animate attributeName="transform" attributeType="XML" type="translate" values="0 0; 2 2; -2 1; 0 0; 0 0" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.45;0.1;0.35;0.12;0" dur="3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="70" y1="112" x2="930" y2="112" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.25;0;0.2;0" dur="1.1s" repeatCount="indefinite"/>
  </line>
</svg>
